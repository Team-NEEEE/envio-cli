# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: envio

before:
  hooks:
    - go mod tidy

builds:
  - id: envio
    main: ./cmd/envio
    binary: envio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: envio-archive
    ids:
      - envio
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: Team-NEEEE
    name: envio-cli

homebrew_casks:
  - name: envio
    ids:
      - envio-archive
    repository:
      owner: Team-NEEEE
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Team-NEEEE/envio-cli"
    description: "Zero-knowledge environment variable and secret management CLI"
    binaries:
      - envio

scoops:
  - name: envio
    ids:
      - envio-archive
    repository:
      owner: Team-NEEEE
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/Team-NEEEE/envio-cli"
    description: "Zero-knowledge environment variable and secret management CLI"
